[package]
name = "rigel-server"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bitflags = "2.11.1"
chrono = "0.4.38"
dotenvy = "0.15.7"
flate2 = "1.1.11"
futures-util = "0.3.32"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "mysql", "macros", "migrate"] }
tar = "0.4.46"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.11", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.23.1", features = ["v4"] }
zstd = { version = "0.14.4", default-features = false }