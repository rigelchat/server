name: Release

# Trigger on SemVer tags (glob syntax, not regex: e.g., v1.0.0, v1.2.3-rc.1)
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

env:
  BIN_NAME: rigel-server

jobs:
  # --------------------------------------------------------------------------
  # 1. Validate version & create a Draft Release
  # --------------------------------------------------------------------------
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Validate Cargo version and tag metadata
        id: meta
        run: |
          TAG_BASE="${TAG_VERSION%%-*}"

          if [ -n "$PKG_VERSION" ] && [ "$PKG_VERSION" != "$TAG_VERSION" ] && [ "$PKG_VERSION" != "$TAG_BASE" ]; then
            echo "::error::Version mismatch! Tag is '$TAG_VERSION' but Cargo.toml version is '$PKG_VERSION'."
            exit 1
          fi

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ steps.meta.outputs.is_prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "${{ github.ref_name }}" \
            --title "${{ env.BIN_NAME }} ${{ github.ref_name }}" \
            --notes "" \
            --draft \
            $PRERELEASE_FLAG

  # --------------------------------------------------------------------------
  # 2. Build and upload binaries to the Draft Release
  # --------------------------------------------------------------------------
  build-and-upload:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: i686-pc-windows-msvc }

          # macOS (macos-latest also cross-compiles x86_64-apple-darwin)
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }

          # Linux
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf }
          - { os: ubuntu-latest,  target: arm-unknown-linux-musleabihf }
          - { os: ubuntu-latest,  target: riscv64gc-unknown-linux-gnu }

          # Android
          - { os: ubuntu-latest,  target: aarch64-linux-android }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Configure Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_BIN="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android21-clang++"
            echo "AR_aarch64_linux_android=${NDK_BIN}/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${NDK_BIN}/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android21-clang"
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}"
          } >> "$GITHUB_ENV"

      - name: Build, package, and upload release assets
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ env.BIN_NAME }}
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.target == 'aarch64-linux-android' && 'cargo' || '' }}
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE,.env.example
          token: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 3. Generate Changelog & Publish Release
  # --------------------------------------------------------------------------
  publish:
    name: Publish Release
    needs: [prepare, build-and-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Release Notes and Commits
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" HEAD^ 2>/dev/null || echo "")
  
          COMMIT_COUNT=$(git rev-list --count "${PREV_TAG:+${PREV_TAG}..}HEAD")
          CONTRIB_COUNT=$(git log "${PREV_TAG:+${PREV_TAG}..}HEAD" --format="%ae" | sort -u | wc -l)
  
          GH_NOTES=""
          if [ -n "$PREV_TAG" ]; then
            GH_NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
              -f tag_name="${{ github.ref_name }}" \
              -f previous_tag_name="$PREV_TAG" \
              --jq '.body' || echo "")
          fi

          # Fetch commits with GitHub @username so GitHub renders the Contributors avatar bar
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(gh api "repos/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}" \
              --jq '.commits[] | select((.parents | length) <= 1) | "- \(.commit.message | split("\n")[0]) ([\(.sha[0:7])](\(.html_url))) by \(if .author.login then "@" + .author.login else .commit.author.name end)"' || echo "")
            COMPARE_URL="${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG}...${{ github.ref_name }}"
          else
            COMMITS=$(gh api "repos/${{ github.repository }}/commits?sha=${{ github.ref_name }}&per_page=100" \
              --jq 'reverse | .[] | select((.parents | length) <= 1) | "- \(.commit.message | split("\n")[0]) ([\(.sha[0:7])](\(.html_url))) by \(if .author.login then "@" + .author.login else .commit.author.name end)"' || echo "")
            COMPARE_URL=""
          fi

          DELIM="GH_EOF_$(date +%s%N)"
          {
            echo "gh_notes<<${DELIM}"
            echo "$GH_NOTES"
            echo "${DELIM}"
            echo "commits<<${DELIM}"
            echo "$COMMITS"
            echo "${DELIM}"
            echo "compare_url=${COMPARE_URL}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Release Body
        env:
          GH_NOTES: ${{ steps.notes.outputs.gh_notes }}
          COMMITS: ${{ steps.notes.outputs.commits }}
          COMPARE_URL: ${{ steps.notes.outputs.compare_url }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        run: |
          BASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BIN_NAME }}"

          if [ "$IS_PRERELEASE" = "true" ]; then
            cat << 'EOF' > release_body.md
          > [!WARNING]
          > **Pre-release:** Rigel Server **TAG_NAME** is a preview build intended for testing. It may be unstable or contain breaking changes.

          EOF
          else
            cat << 'EOF' > release_body.md
          Rigel Server **TAG_NAME** is now available. Pre-built binaries and SHA-256 checksums are listed below, followed by all changes in this release.

          EOF
          fi

          cat << 'EOF' >> release_body.md
          ## Downloads

          | OS | Architecture | Package | Checksum |
          | :--- | :--- | :---: | :---: |
          | 🪟 **Windows** | `x86_64` (64-bit) | [.zip](BASE_URL-x86_64-pc-windows-msvc.zip) | [sha256](BASE_URL-x86_64-pc-windows-msvc.sha256) |
          | | `i686` (32-bit) | [.zip](BASE_URL-i686-pc-windows-msvc.zip) | [sha256](BASE_URL-i686-pc-windows-msvc.sha256) |
          | 🍎 **macOS** | Apple Silicon (`aarch64`) | [.tar.gz](BASE_URL-aarch64-apple-darwin.tar.gz) | [sha256](BASE_URL-aarch64-apple-darwin.sha256) |
          | | Intel (`x86_64`) | [.tar.gz](BASE_URL-x86_64-apple-darwin.tar.gz) | [sha256](BASE_URL-x86_64-apple-darwin.sha256) |
          | 🐧 **Linux** | `x86_64` (glibc) | [.tar.gz](BASE_URL-x86_64-unknown-linux-gnu.tar.gz) | [sha256](BASE_URL-x86_64-unknown-linux-gnu.sha256) |
          | | `x86_64` (musl static) | [.tar.gz](BASE_URL-x86_64-unknown-linux-musl.tar.gz) | [sha256](BASE_URL-x86_64-unknown-linux-musl.sha256) |
          | | `ARM64` (AArch64) | [.tar.gz](BASE_URL-aarch64-unknown-linux-gnu.tar.gz) | [sha256](BASE_URL-aarch64-unknown-linux-gnu.sha256) |
          | | `ARMv7` (32-bit HF) | [.tar.gz](BASE_URL-armv7-unknown-linux-gnueabihf.tar.gz) | [sha256](BASE_URL-armv7-unknown-linux-gnueabihf.sha256) |
          | | `ARMv6` (32-bit musl) | [.tar.gz](BASE_URL-arm-unknown-linux-musleabihf.tar.gz) | [sha256](BASE_URL-arm-unknown-linux-musleabihf.sha256) |
          | | `RISC-V 64` (`riscv64gc`) | [.tar.gz](BASE_URL-riscv64gc-unknown-linux-gnu.tar.gz) | [sha256](BASE_URL-riscv64gc-unknown-linux-gnu.sha256) |
          | 🤖 **Android** | `ARM64` (AArch64) | [.tar.gz](BASE_URL-aarch64-linux-android.tar.gz) | [sha256](BASE_URL-aarch64-linux-android.sha256) |

          *For Linux, prefer <code>musl static</code> on Docker, Alpine, or older distributions.*

          EOF
          sed -i "s|BASE_URL|${BASE_URL}|g" release_body.md
          sed -i "s|TAG_NAME|${{ github.ref_name }}|g" release_body.md

          if echo "$GH_NOTES" | grep -q "## What's Changed"; then
            printf '%s\n' "$GH_NOTES" >> release_body.md
          else
            if [ -n "$COMMITS" ]; then
              printf "## What's Changed\n\n%s\n\n" "$COMMITS" >> release_body.md
            fi
            if [ -n "$COMPARE_URL" ]; then
              printf '**Full Changelog**: %s\n' "$COMPARE_URL" >> release_body.md
            fi
          fi

          cat release_body.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file release_body.md \
            --draft=false \
            --prerelease="${{ needs.prepare.outputs.is_prerelease }}"