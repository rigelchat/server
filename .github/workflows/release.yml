name: Release

# Trigger on SemVer tags (glob syntax, not regex: e.g., v1.0.0, v1.2.3-rc.1)
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: read-all

env:
  BIN_NAME: rigel-server

jobs:
  # --------------------------------------------------------------------------
  # 1. Validate version & create a Draft Release
  # --------------------------------------------------------------------------
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Validate Cargo version and tag metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          TAG_VERSION="${TAG#v}"

          # Verify that Cargo.toml version matches the pushed git tag
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg name "$BIN_NAME" '.packages[] | select(.name == $name) | .version')

          if [ -n "$PKG_VERSION" ] && [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! Tag is '$TAG_VERSION' but Cargo.toml version is '$PKG_VERSION'."
            exit 1
          fi

          # Detect pre-releases (e.g., v1.0.0-alpha.1, v1.0.0-rc.1)
          if [[ "$TAG_VERSION" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.BIN_NAME }} ${{ github.ref_name }}
          draft: true
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}

  # --------------------------------------------------------------------------
  # 2. Build and upload binaries to the Draft Release
  # --------------------------------------------------------------------------
  build-and-upload:
    name: Build (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: i686-pc-windows-msvc }

          # macOS (macos-latest also cross-compiles x86_64-apple-darwin)
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-latest,   target: x86_64-apple-darwin }

          # Linux
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: armv7-unknown-linux-gnueabihf }
          - { os: ubuntu-latest,  target: arm-unknown-linux-musleabihf }

          # Android
          - { os: ubuntu-latest,  target: aarch64-linux-android }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Configure Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_BIN="${ANDROID_NDK_LATEST_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android21-clang"
            echo "CXX_aarch64_linux_android=${NDK_BIN}/aarch64-linux-android21-clang++"
            echo "AR_aarch64_linux_android=${NDK_BIN}/llvm-ar"
            echo "RANLIB_aarch64_linux_android=${NDK_BIN}/llvm-ranlib"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_BIN}/aarch64-linux-android21-clang"
            echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME}"
          } >> "$GITHUB_ENV"

      - name: Build, package, and upload release assets
        uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: ${{ env.BIN_NAME }}
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.target == 'aarch64-linux-android' && 'cargo' || '' }}
          tar: unix
          zip: windows
          checksum: sha256
          include: README.md,LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}

  # --------------------------------------------------------------------------
  # 3. Generate Changelog & Publish Release
  # --------------------------------------------------------------------------
  publish:
    name: Publish Release
    needs: [prepare, build-and-upload]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate Release Notes and Commits
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 --match "v[0-9]*" HEAD^ 2>/dev/null || echo "")
          RANGE="${PREV_TAG:+${PREV_TAG}..}HEAD"

          # Native GitHub release notes (categorized PRs, @mentions, Full Changelog link)
          GH_NOTES=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" \
            ${PREV_TAG:+-f previous_tag_name="$PREV_TAG"} \
            --jq '.body' || echo "")

          COMMITS=$(git log "$RANGE" --pretty=format:"* %s ([%h](${{ github.server_url }}/${{ github.repository }}/commit/%H))" --no-merges)

          DELIM="GH_EOF_$(date +%s%N)"
          {
            echo "gh_notes<<${DELIM}"
            echo "$GH_NOTES"
            echo "${DELIM}"
            echo "commits<<${DELIM}"
            echo "$COMMITS"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Release Body
        env:
          GH_NOTES: ${{ steps.notes.outputs.gh_notes }}
          COMMITS: ${{ steps.notes.outputs.commits }}
        run: |
          BASE_URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ env.BIN_NAME }}"
          cat << 'EOF' > release_body.md
          ## Downloads

          | OS | Architecture | Package | Checksum |
          | :--- | :--- | :---: | :---: |
          | 🪟 **Windows** | `x86_64` (64-bit) | [📦 .zip](BASE_URL-x86_64-pc-windows-msvc.zip) | [🔒 sha256](BASE_URL-x86_64-pc-windows-msvc.zip.sha256) |
          | | `i686` (32-bit) | [📦 .zip](BASE_URL-i686-pc-windows-msvc.zip) | [🔒 sha256](BASE_URL-i686-pc-windows-msvc.zip.sha256) |
          | 🍎 **macOS** | Apple Silicon (`aarch64`) | [📦 .tar.gz](BASE_URL-aarch64-apple-darwin.tar.gz) | [🔒 sha256](BASE_URL-aarch64-apple-darwin.tar.gz.sha256) |
          | | Intel (`x86_64`) | [📦 .tar.gz](BASE_URL-x86_64-apple-darwin.tar.gz) | [🔒 sha256](BASE_URL-x86_64-apple-darwin.tar.gz.sha256) |
          | 🐧 **Linux** | `x86_64` (glibc) | [📦 .tar.gz](BASE_URL-x86_64-unknown-linux-gnu.tar.gz) | [🔒 sha256](BASE_URL-x86_64-unknown-linux-gnu.tar.gz.sha256) |
          | | `x86_64` (musl static) | [📦 .tar.gz](BASE_URL-x86_64-unknown-linux-musl.tar.gz) | [🔒 sha256](BASE_URL-x86_64-unknown-linux-musl.tar.gz.sha256) |
          | | `ARM64` (AArch64) | [📦 .tar.gz](BASE_URL-aarch64-unknown-linux-gnu.tar.gz) | [🔒 sha256](BASE_URL-aarch64-unknown-linux-gnu.tar.gz.sha256) |
          | | `ARMv7` (32-bit HF) | [📦 .tar.gz](BASE_URL-armv7-unknown-linux-gnueabihf.tar.gz) | [🔒 sha256](BASE_URL-armv7-unknown-linux-gnueabihf.tar.gz.sha256) |
          | | `ARMv6` (32-bit musl) | [📦 .tar.gz](BASE_URL-arm-unknown-linux-musleabihf.tar.gz) | [🔒 sha256](BASE_URL-arm-unknown-linux-musleabihf.tar.gz.sha256) |
          | 🤖 **Android** | `ARM64` (AArch64) | [📦 .tar.gz](BASE_URL-aarch64-linux-android.tar.gz) | [🔒 sha256](BASE_URL-aarch64-linux-android.tar.gz.sha256) |

          ---
          EOF
          sed -i "s|BASE_URL|${BASE_URL}|g" release_body.md

          if [ -n "$GH_NOTES" ]; then
            printf '\n%s\n' "$GH_NOTES" >> release_body.md
          fi

          printf '\n<details>\n<summary>📝 Commits in this release</summary>\n\n%s\n\n</details>\n' "$COMMITS" >> release_body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ env.BIN_NAME }} ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' }}